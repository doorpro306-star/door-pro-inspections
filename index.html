<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Door Pro | Inspection Reports</title><style>
:root{font-family:system-ui,Arial;color:#182634;background:#eef2f5}*{box-sizing:border-box}body{margin:0}header{background:#152b3b;color:white;padding:18px}header button{background:transparent;color:white;border:0;font-size:25px;font-weight:800;cursor:pointer}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #142b3b12}h1{font-size:23px}h2{font-size:19px}label{display:block;font-weight:600;margin:12px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #bac6d0;border-radius:7px;font:inherit}textarea{min-height:80px}button{background:#17618a;color:white;border:0;border-radius:7px;padding:11px 15px;margin:6px 5px 6px 0;font:inherit;cursor:pointer}.secondary{background:#e5edf2;color:#18384b}.danger{background:#a52f36}.muted{color:#596b77}.row{border-top:1px solid #ddd;padding:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:540px){.grid{grid-template-columns:1fr}}@media print{header,.noprint,button{display:none!important}.card{box-shadow:none}body{background:white}}[hidden]{display:none!important}</style></head><body><header><button id="home" aria-label="Return to registry">DOOR PRO</button><div>Inspection Reports</div></header><main class="wrap"><section id="registry"><div class="card"><h1>Door Inspection Registry</h1><p class="muted">Register a customer, facility and door. Each door keeps its own inspection history on this device.</p><form id="doorForm"><div class="grid"><div><label>Customer</label><input name="customer" required></div><div><label>Facility / location</label><input name="facility" required></div><div><label>Door number</label><input name="number" required></div><div><label>Door name</label><input name="name" required placeholder="Loading bay 1"></div></div><button>+ Register Door</button></form></div><div class="card"><h2>Registered Doors</h2><input id="search" placeholder="Search customer, facility or door" aria-label="Search doors"><div id="doors"></div></div><div class="card noprint"><button id="backup" class="secondary">Export JSON Backup</button><button id="restore" class="secondary">Restore JSON Backup</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div></section><section id="inspection" hidden><div class="card"><button class="secondary noprint" id="back">← Door Registry</button><h1 id="inspectionTitle"></h1><p id="inspectionInfo"></p><form id="inspectionForm"><div class="grid"><div><label>Inspection date</label><input name="date" type="date" required></div><div><label>Technician</label><input name="technician" required></div><div><label>Work order (optional)</label><input name="workOrder"></div><div><label>Door type / size</label><input name="doorType"></div></div><h2>12-point inspection checklist</h2><div id="items"></div><label>Findings / maintenance performed</label><textarea name="findings"></textarea><label>Repairs recommended</label><textarea name="repairs"></textarea><label>Photos (optional)</label><input id="photos" type="file" accept="image/*" capture="environment" multiple><p class="muted">Photos are compressed before saving. Browser storage is limited; export backups regularly.</p><div id="photoPreview"></div><button id="saveInspection">Save Inspection</button><button type="button" id="cancel" class="secondary">Cancel</button></form></div></section><section id="report" hidden><div class="card"><button id="reportBack" class="secondary noprint">← Door Registry</button><div id="reportBody"></div><button class="noprint" onclick="window.print()">Print / Save PDF</button></div></section></main><script>
const KEY='doorpro-inspection-only-v1', ITEMS=['Visual inspection of door panels and sections','Inspect tracks and mounting brackets','Inspect rollers and hinges','Inspect cables and cable drums','Inspect springs and spring hardware','Inspect shaft, bearings and couplings','Inspect bottom seal and weatherstripping','Inspect fasteners and structural supports','Lubricate applicable moving components','Inspect operator and drive system','Test safety devices and reversing functions','Perform operational and balance check'];let db=load(),active=null,photos=[];function load(){try{let v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.doors)?v:{doors:[]}}catch{return{doors:[]}}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save: browser storage may be full. Export a backup and reduce photo sizes.');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){for(const s of ['registry','inspection','report'])document.getElementById(s).hidden=s!==id;window.scrollTo(0,0)}function render(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('doors').innerHTML=db.doors.filter(d=>[d.customer,d.facility,d.number,d.name].join(' ').toLowerCase().includes(q)).map(d=>`<div class="row"><strong>${esc(d.name)}</strong> · Door ${esc(d.number)}<br><span class="muted">${esc(d.customer)} / ${esc(d.facility)} · ${(d.inspections||[]).length} inspections</span><br><button data-add="${esc(d.id)}">+ Add Inspection</button><details><summary>Inspection History</summary>${(d.inspections||[]).slice().reverse().map(i=>`<p>${esc(i.date)} · ${esc(i.technician)} <button class="secondary" data-view="${esc(d.id)}" data-inspection="${esc(i.id)}">View Report</button></p>`).join('')||'<p>No inspections yet.</p>'}</details></div>`).join('')||'<p class="muted">No matching registered doors.</p>'}document.getElementById('doorForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(db.doors.some(d=>d.customer.toLowerCase()===v.customer.trim().toLowerCase()&&d.facility.toLowerCase()===v.facility.trim().toLowerCase()&&d.number.toLowerCase()===v.number.trim().toLowerCase())){alert('This door number is already registered at that customer and facility.');return}let d={id:crypto.randomUUID(),...Object.fromEntries(Object.entries(v).map(([k,x])=>[k,x.trim()])),inspections:[]};db.doors.push(d);if(persist()){e.target.reset();render()}};document.getElementById('doors').onclick=e=>{let a=e.target.closest('[data-add]'),v=e.target.closest('[data-view]');if(a)start(a.dataset.add);if(v)report(v.dataset.view,v.dataset.inspection)};document.getElementById('search').oninput=render;function start(id){active=id;photos=[];let d=db.doors.find(x=>x.id===id);document.getElementById('inspectionTitle').textContent=d.name+' — Door '+d.number;document.getElementById('inspectionInfo').textContent=d.customer+' / '+d.facility;let f=document.getElementById('inspectionForm');f.reset();f.elements.date.value=new Date().toLocaleDateString('en-CA');document.getElementById('items').innerHTML=ITEMS.map((t,k)=>`<div class="row"><label>${k+1}. ${esc(t)}</label><select name="status${k}" required><option value="">Select result</option><option>Pass</option><option>Attention Required</option><option>Fail</option><option>Not Applicable</option></select></div>`).join('');document.getElementById('photoPreview').textContent='';show('inspection')}document.getElementById('photos').onchange=async e=>{photos=[];for(const file of Array.from(e.target.files).slice(0,4)){let url=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});let img=new Image;await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.65))}document.getElementById('photoPreview').textContent=photos.length+' photo(s) selected'};document.getElementById('inspectionForm').onsubmit=e=>{e.preventDefault();let f=e.target,d=db.doors.find(x=>x.id===active),data=Object.fromEntries(new FormData(f));let i={id:crypto.randomUUID(),date:data.date,technician:data.technician,workOrder:data.workOrder,doorType:data.doorType,findings:data.findings,repairs:data.repairs,status:ITEMS.map((_,k)=>data['status'+k]),photos};d.inspections.push(i);if(persist()){render();report(d.id,i.id)}else d.inspections.pop()};function report(did,iid){let d=db.doors.find(x=>x.id===did),i=d?.inspections.find(x=>x.id===iid);if(!i)return;document.getElementById('reportBody').innerHTML=`<h1>Door Pro Inspection Report</h1><p><strong>${esc(d.customer)} / ${esc(d.facility)}</strong><br>${esc(d.name)} — Door ${esc(d.number)}<br>Date: ${esc(i.date)}<br>Technician: ${esc(i.technician)}<br>Work order: ${esc(i.workOrder)}<br>Door type / size: ${esc(i.doorType)}</p><h2>12-point checklist</h2>${ITEMS.map((t,k)=>`<div class="row">${k+1}. ${esc(t)} — <strong>${esc(i.status[k])}</strong></div>`).join('')}<h2>Findings / maintenance performed</h2><p>${esc(i.findings)}</p><h2>Repairs recommended</h2><p>${esc(i.repairs)}</p>${(i.photos||[]).map(p=>`<img src="${p}" alt="Inspection photo" style="max-width:100%;max-height:380px;margin:8px">`).join('')}`;show('report')}for(const id of ['home','back','cancel','reportBack'])document.getElementById(id).onclick=()=>{render();show('registry')};document.getElementById('backup').onclick=()=>{let blob=new Blob([JSON.stringify({format:KEY,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Door_Pro_Inspection_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('restore').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!==KEY||!Array.isArray(x.data?.doors))throw Error('Unsupported backup');if(!confirm('Replace all current inspection records with this backup? Export current data first.'))return;let old=db;db=x.data;if(!persist())db=old;render()}catch(err){alert('Restore failed: '+err.message)}e.target.value=''};render();</script></body></html>
